version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: corelign-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app:cached
      - ./backend/data:/data

  frontend:
    image: node:20
    container_name: corelign-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://backend:8000
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
